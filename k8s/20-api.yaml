apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: devapp
spec:
  replicas: 2
  selector:
    matchLabels: { app: api }
  template:
    metadata:
      labels: { app: api }
    spec:
      containers:
        - name: api
          image: devapp/api:dev
          imagePullPolicy: IfNotPresent   # image is imported into containerd, not pulled
          ports:
            - containerPort: 8000
          env:
            - name: DATABASE_URL
              value: postgresql://app:app@postgres.devapp.svc.cluster.local:5432/appdb
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 256Mi }
          livenessProbe:
            httpGet: { path: /healthz, port: 8000 }
            initialDelaySeconds: 5
          readinessProbe:
            httpGet: { path: /readyz, port: 8000 }
            initialDelaySeconds: 5
            periodSeconds: 5
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000      # numeric UID required: kubelet cannot verify a named USER
            runAsGroup: 1000
            allowPrivilegeEscalation: false
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: devapp
spec:
  type: NodePort
  selector: { app: api }
  ports:
    - port: 80
      targetPort: 8000
      nodePort: 30080
