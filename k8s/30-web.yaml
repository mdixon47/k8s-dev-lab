# Static site + API proxy. Deliberately the hardened counterpart of 20-api.yaml: it passes the
# "restricted" Pod Security profile (compare with `make sectest ROUTINE=07`).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: devapp
spec:
  replicas: 2
  selector:
    matchLabels: { app: web }
  template:
    metadata:
      labels: { app: web }
    spec:
      automountServiceAccountToken: false   # nginx never talks to the API server
      securityContext:
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: web
          image: devapp/web:dev
          imagePullPolicy: IfNotPresent   # imported into containerd by make image
          ports:
            - containerPort: 8080
          resources:
            requests: { cpu: 50m, memory: 32Mi }
            limits: { cpu: 200m, memory: 64Mi }
          livenessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 3
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
            periodSeconds: 5
          securityContext:
            runAsNonRoot: true
            runAsUser: 101      # nginx user in nginx-unprivileged
            runAsGroup: 101
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }                 # pid file, client body/proxy temp
            - { name: cache, mountPath: /var/cache/nginx }
      volumes:
        - { name: tmp, emptyDir: {} }
        - { name: cache, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: devapp
spec:
  type: NodePort
  selector: { app: web }
  ports:
    - port: 80
      targetPort: 8080
      nodePort: 30081
