# Lesson 23, the positive test. Chainguard's public nginx: non-root (uid 65532), listens
# on 8080, no shell. Only the `latest` tag is public, which lesson 28 turns into a lesson.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: approved
  namespace: devapp
spec:
  replicas: 1
  selector:
    matchLabels: { app: approved }
  template:
    metadata:
      labels: { app: approved }
    spec:
      containers:
        - name: web
          image: cgr.dev/chainguard/nginx:latest
          ports: [{ containerPort: 8080 }]
          resources:
            requests: { cpu: 50m, memory: 32Mi }
            limits:   { cpu: 200m, memory: 64Mi }
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
