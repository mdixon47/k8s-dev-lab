# The same pod in `default`: no constraint matches that namespace, so it is admitted.
apiVersion: v1
kind: Pod
metadata:
  name: sec-test-privileged
  namespace: default
spec:
  hostPID: true
  hostNetwork: true
  containers:
    - name: shell
      image: busybox:1.36
      command: ["sleep", "3600"]
      securityContext:
        privileged: true
      volumeMounts:
        - name: host
          mountPath: /host
  volumes:
    - name: host
      hostPath:
        path: /
