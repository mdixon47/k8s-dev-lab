# security/policies/privileged-pod.yaml placed in devapp, where the constraints match.
# Trips every rule: privileged, two host namespaces, a hostPath, no securityContext, no limits.
apiVersion: v1
kind: Pod
metadata:
  name: sec-test-privileged
  namespace: devapp
spec:
  hostPID: true
  hostNetwork: true
  containers:
    - name: shell
      image: busybox:1.36
      command: ["sleep", "3600"]
      securityContext:
        privileged: true
      volumeMounts:
        - name: host
          mountPath: /host
  volumes:
    - name: host
      hostPath:
        path: /
