# Every container must run as non-root and refuse privilege escalation, the two settings
# CLAUDE.md asks every workload in this lab to keep. runAsNonRoot may be set at the pod or
# the container level; allowPrivilegeEscalation defaults to true, so it must be set to false.
apiVersion: templates.gatekeeper.sh/v1
kind: ConstraintTemplate
metadata:
  name: k8slabnonroot
  annotations:
    description: Require runAsNonRoot true and allowPrivilegeEscalation false on every container.
spec:
  crd:
    spec:
      names:
        kind: K8sLabNonRoot
  targets:
    - target: admission.k8s.gatekeeper.sh
      rego: |
        package k8slabnonroot

        pod_spec = s { input.review.kind.kind == "Pod"; s := input.review.object.spec }
        pod_spec = s { input.review.kind.kind != "Pod"; s := input.review.object.spec.template.spec }

        containers[c] { c := pod_spec.containers[_] }
        containers[c] { c := pod_spec.initContainers[_] }

        non_root(c) { c.securityContext.runAsNonRoot == true }
        non_root(c) {
          not c.securityContext.runAsNonRoot == false
          pod_spec.securityContext.runAsNonRoot == true
        }

        violation[{"msg": msg}] {
          c := containers[_]
          not non_root(c)
          msg := sprintf("container %q must set securityContext.runAsNonRoot: true (pod or container level)", [c.name])
        }

        violation[{"msg": msg}] {
          c := containers[_]
          not c.securityContext.allowPrivilegeEscalation == false
          msg := sprintf("container %q must set securityContext.allowPrivilegeEscalation: false", [c.name])
        }
