# Only pods labelled app=api in the devapp namespace may reach Postgres.
# NOTE: Flannel does not enforce NetworkPolicy. This object is accepted by the API server
# and silently ignored until a policy-capable CNI (Calico, Cilium) is installed.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-only-from-api
  namespace: devapp
spec:
  podSelector:
    matchLabels:
      app: postgres
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: api
      ports:
        - port: 5432
          protocol: TCP
