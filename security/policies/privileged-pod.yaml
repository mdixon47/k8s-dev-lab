# Deliberately terrible pod used by 07-pod-security-admission.sh. Never apply for real.
apiVersion: v1
kind: Pod
metadata:
  name: sec-test-privileged
spec:
  hostPID: true
  hostNetwork: true
  containers:
    - name: shell
      image: busybox:1.36
      command: ["sleep", "3600"]
      securityContext:
        privileged: true
      volumeMounts:
        - name: host
          mountPath: /host
  volumes:
    - name: host
      hostPath:
        path: /
