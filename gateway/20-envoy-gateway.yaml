# Envoy Gateway: the GatewayClass names the controller that implements it, the Gateway is
# the listener set that controller turns into a running Envoy (Deployment + Service in
# envoy-gateway-system). spec.addresses asks MetalLB for a fixed address, so the training
# and the web edge can rely on 192.168.56.100.
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: eg
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: eg
  namespace: gateways
spec:
  gatewayClassName: eg
  addresses:
    - type: IPAddress
      value: 192.168.56.100
  listeners:
    - name: http
      port: 80
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: All      # HTTPRoutes in any namespace may attach (lesson 5 tightens this)
