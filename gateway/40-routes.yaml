# The application team's side: HTTPRoutes in devapp, attached to BOTH gateways through two
# parentRefs. Every rule below is served identically by Envoy Gateway on .100 and Istio on
# .101, which is the point of the Gateway API: the routing is portable, the implementation
# is not. Mirrors web/nginx.conf: /api/ is rewritten to / on the api Service, /docs and
# /openapi.json pass through to the api, everything else goes to the site.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: api
  namespace: devapp
spec:
  parentRefs:
    - name: eg
      namespace: gateways
    - name: istio
      namespace: gateways
  rules:
    - matches:
        - path: { type: PathPrefix, value: /api/ }
      filters:
        - type: URLRewrite
          urlRewrite:
            path: { type: ReplacePrefixMatch, replacePrefixMatch: / }
      backendRefs:
        - name: api
          port: 80
    - matches:
        - path: { type: Exact, value: /docs }
        - path: { type: Exact, value: /openapi.json }
      backendRefs:
        - name: api
          port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: web
  namespace: devapp
spec:
  parentRefs:
    - name: eg
      namespace: gateways
    - name: istio
      namespace: gateways
  rules:
    - matches:
        - path: { type: PathPrefix, value: / }
      backendRefs:
        - name: web
          port: 80
