# Capstone (lesson 10): the web edge VM proxies to the gateways instead of the NodePorts.
# Install on the web VM:
#   vagrant ssh web -c 'sudo cp /vagrant/gateway/examples/edge-gateway.conf /etc/nginx/sites-available/edge && sudo nginx -t && sudo systemctl reload nginx'
# Restore the NodePort version:  vagrant provision web --provision-with web
#
# Two things differ from the NodePort config scripts/web.sh writes:
#  - proxy_http_version 1.1: nginx proxies with HTTP/1.0 by default and Envoy (both
#    gateways) answers that with 426 Upgrade Required.
#  - proxy_pass keeps the /api/ prefix (no trailing slash): the HTTPRoute does the rewrite.
upstream gateway {
    server 192.168.56.100:80 max_fails=2 fail_timeout=10s;   # Envoy Gateway
    server 192.168.56.101:80 max_fails=2 fail_timeout=10s;   # Istio, second in rotation
}

server {
    listen 80 default_server;
    listen 443 ssl default_server;
    ssl_certificate     /etc/nginx/edge.crt;
    ssl_certificate_key /etc/nginx/edge.key;
    server_name _;
    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;

    location = /edge-healthz { return 200 "ok\n"; add_header Content-Type text/plain; }

    location / {
        proxy_pass http://gateway;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_next_upstream error timeout http_502 http_503;
    }
}
